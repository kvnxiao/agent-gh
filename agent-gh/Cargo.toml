[package]
name = "agent-gh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
camino = "1.2.6"
dirs = "7.0.0"
fs-err = "3.3.1"
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[dev-dependencies]
aws-lc-rs = "1.18.1"
pem = "4.0.0"
tempfile = "3.27.0"
